name: Check manuscript transfer
on:
  push:
    branches: [main]
    paths: ['.github/workflows/check-minkowski-transfer.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-transfer
          path: .github/minkowski-content-publication.json
          include-hidden-files: true
          retention-days: 1
